[project]
name = "hermes-video-tutor"
version = "0.1.0"
description = "A Hermes-powered video tutor that autonomously acquires transcript and visual evidence."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
ui = ["streamlit>=1.36"]
dev = ["pytest>=8", "PyYAML>=6"]

[project.scripts]
video-tutor = "video_tutor.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]